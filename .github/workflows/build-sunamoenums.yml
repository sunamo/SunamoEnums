name: Build SunamoEnums

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build SunamoEnums
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore SunamoEnums/SunamoEnums.csproj

    - name: Build
      run: dotnet build SunamoEnums/SunamoEnums.csproj --configuration Release --no-restore

  test:
    name: Test SunamoEnums.Tests
    runs-on: ${{ matrix.os }}
    needs: build

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore SunamoEnums.Tests/SunamoEnums.Tests.csproj

    - name: Build tests
      run: dotnet build SunamoEnums.Tests/SunamoEnums.Tests.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test SunamoEnums.Tests/SunamoEnums.Tests.csproj --configuration Release --no-build --verbosity normal
      continue-on-error: true
